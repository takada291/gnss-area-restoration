<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSS区域復元</title>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        :root {
            --primary: #2c3e50;
            --bg-color: #f8f9fa;
            --accent: #27ae60; /* 林業らしく少しグリーン寄りに */
            --error-bg: #ffe6e6;
            --success-bg: #e6ffe6;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0; padding: 20px; line-height: 1.6;
        }
        h1 {
            color: var(--primary);
            text-align: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
        }
        .container {
            max-width: 900px; margin: 0 auto;
            background: white; padding: 20px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group { margin-bottom: 15px; }
        label {
            display: block; font-weight: bold; margin-bottom: 5px;
            color: var(--primary); font-size: 0.9rem;
        }
        input[type="password"], input[type="file"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        .btn-run {
            width: 100%; padding: 15px; background-color: var(--accent);
            color: white; border: none; border-radius: 4px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
            transition: background 0.3s;
        }
        .btn-run:hover { background-color: #1e8449; }
        .btn-run:disabled { background-color: #ccc; cursor: not-allowed; }
        .api-note {
            font-size: 0.8rem; color: #666; background: #eee;
            padding: 10px; border-radius: 4px; margin-bottom: 20px;
        }
        #loading-msg {
            text-align: center; font-weight: bold; color: var(--accent);
            display: none; margin-top: 20px;
        }
        #result-area { display: none; margin-top: 30px; }
        
        /* SVG描画エリアのレスポンシブ化 */
        #svg-area {
            margin-bottom: 20px;
            text-align: center;
        }
        #svg-area svg {
            max-width: 100%;
            height: auto;
            display: inline-block;
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        table {
            width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem;
        }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: var(--primary); color: white; }
        
        .summary-box {
            background: var(--success-bg); padding: 15px; border-radius: 5px;
            margin-bottom: 20px; border: 1px solid #b3ffb3;
            text-align: center;
        }
        .summary-box h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 1.5rem; }
        
        .editable-input {
            width: 100%; min-width: 60px; padding: 6px;
            border: 1px solid #ccc; border-radius: 4px;
            text-align: right; font-family: inherit;
            font-size: 0.95rem; background-color: #fff;
            box-sizing: border-box;
        }
        .editable-input[type="text"] { text-align: center; }
        .editable-input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 3px rgba(39, 174, 96, 0.5);
        }
        .editable-input.edited {
            background-color: #fff3cd; border-color: #ffeeba; color: #856404;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GNSS区域復元 v0.1</h1>
        
        <div class="api-note">
            <strong>APIキー設定（初回のみ）</strong><br>
            ブラウザに保存されるため、次回以降の入力は不要です。
        </div>
        <div class="input-group">
            <input type="password" id="api-key" placeholder="Google Gemini APIキーを入力">
        </div>

        <div class="input-group">
            <label>GNSS野帳の写真を一括選択してください</label>
            <input type="file" id="image-upload" accept="image/*" multiple>
            <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">※複数枚ある場合は、ファイル名順（撮影順）に1つの区域として結合されます。不要な行は撮影時に白紙等で隠してください。</p>
        </div>
        
        <button class="btn-run" id="btn-run">野帳を読み込んで図面を復元</button>
        
        <div id="loading-msg">
            ⏳ AIが野帳の座標を読み取り中です...<br>
            <span style="font-size: 0.8rem; color:#666;" id="loading-detail">※複数枚ある場合は少し時間がかかります</span>
        </div>

        <div id="result-area">
            <div id="summary-area" class="summary-box"></div>
            
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 5px; text-align: center;">※図形の赤い頂点をタップすると測点名が表示されます。</p>
            <div id="svg-area"></div>
            
            <p style="font-size: 0.85rem; color: #666; margin-top: 20px; margin-bottom: 5px;">※表内の数値は直接修正できます。修正すると即座に上の図形と面積が再計算されます。</p>
            <table id="result-table">
                <thead>
                    <tr>
                        <th>測点名</th>
                        <th>X座標 (縦)</th>
                        <th>Y座標 (横)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const btn = document.getElementById('btn-run');
        const loading = document.getElementById('loading-msg');
        const loadingDetail = document.getElementById('loading-detail');
        const resultArea = document.getElementById('result-area');
        const apiKeyInput = document.getElementById('api-key');
        const imageInput = document.getElementById('image-upload');

        let currentData = null;
        let audioCtx = null; 

        const savedKey = localStorage.getItem('gemini_api_key_gnss');
        if(savedKey) apiKeyInput.value = savedKey;

        // iOSのオーディオロックを解除
        function unlockAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(audioCtx.currentTime + 0.01);
        }

        // ビープ音
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (type === 'success') {
                [0, 0.2, 0.4].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 1000; // 少し高めで澄んだ音
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.1);
                });
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.value = 150; 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // SVG要素を生成するヘルパー関数
        function createSVGElement(tag, attrs) {
            const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            for (let k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        async function findAvailableModel(apiKey) {
            try {
                loadingDetail.innerText = "最適なAIモデルを探しています...";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`); 
                if (!response.ok) throw new Error("モデルリストの取得に失敗"); 
                const data = await response.json(); 
                const models = data.models || []; 
                const capableModels = models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent") && !m.name.includes("gemini-2.0") ); 
                let bestModel = capableModels.find(m => m.name.includes("gemini-1.5-pro")); 
                if (!bestModel) bestModel = capableModels.find(m => m.name.includes("gemini-1.5-flash")); 
                if (!bestModel && capableModels.length > 0) bestModel = capableModels[0]; 
                if (bestModel) return bestModel.name.replace("models/", ""); 
                return "gemini-1.5-flash"; 
            } catch (e) { 
                return "gemini-1.5-flash"; 
            } 
        } 
        
        async function fileToGenerativePart(file) { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.onloadend = () => { 
                    resolve({ inlineData: { data: reader.result.split(',')[1], mimeType: file.type } }); 
                }; 
                reader.readAsDataURL(file); 
            }); 
        } 

        // 表の描画
        function renderTable(data) {
            const tbody = document.querySelector('#result-table tbody');
            tbody.innerHTML = '';
            data.rows.forEach((row, index) => {
                const tr = document.createElement('tr');
                const createInput = (field, val, type="number") => {
                    let step = type === "number" ? 'step="any"' : '';
                    let valueStr = val !== null && val !== undefined ? val : '';
                    return `<input type="${type}" ${step} class="editable-input" data-index="${index}" data-field="${field}" value="${valueStr}">`;
                };
                tr.innerHTML = `
                    <td>${createInput('point', row.point, 'text')}</td>
                    <td>${createInput('x', row.x, 'number')}</td>
                    <td>${createInput('y', row.y, 'number')}</td>
                `;
                tbody.appendChild(tr);
            });

            // 編集イベントの登録
            document.querySelectorAll('.editable-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    const field = e.target.dataset.field;
                    const type = e.target.type;
                    
                    let val = null;
                    if(e.target.value !== '') {
                        val = type === 'number' ? parseFloat(e.target.value) : e.target.value;
                    }
                    
                    currentData.rows[idx][field] = val;
                    e.target.classList.add('edited');
                    
                    // 値が変更されたら図形と面積を再計算して描画
                    recalculateAndDraw(currentData);
                });
            });
            recalculateAndDraw(data);
        }

        // 計算とSVGの描画
        function recalculateAndDraw(data) {
            let pts = [];
            // 数値として有効なX, Yを持つ行のみ抽出
            data.rows.forEach(row => {
                let x = parseFloat(row.x);
                let y = parseFloat(row.y);
                if (!isNaN(x) && !isNaN(y)) {
                    pts.push({ point: row.point || '無名', x: x, y: y });
                }
            });

            const summaryArea = document.getElementById('summary-area');
            const svgArea = document.getElementById('svg-area');
            svgArea.innerHTML = ''; // クリア

            if (pts.length < 3) {
                summaryArea.innerHTML = `<h3>⚠️ 面積計算には3点以上の有効な座標が必要です</h3>`;
                const svg = createSVGElement('svg', {viewBox: '0 0 600 400', width: '100%'});
                const text = createSVGElement('text', {x: 300, y: 200, fill: '#999', 'font-size': '16px', 'text-anchor': 'middle'});
                text.textContent = '座標データが不足しています';
                svg.appendChild(text);
                svgArea.appendChild(svg);
                return;
            }

            // --- 面積計算 (座標法) ---
            let doubleArea = 0;
            for(let i = 0; i < pts.length; i++) {
                let p1 = pts[i];
                let p2 = pts[(i + 1) % pts.length];
                // 測量座標でも数学座標でも、閉合多角形の面積の絶対値は同一
                doubleArea += (p1.x * p2.y - p2.x * p1.y); 
            }
            let area = Math.abs(doubleArea) / 2;

            summaryArea.innerHTML = `
                <div style="font-size: 0.9rem; color: #666;">算定区域面積 (座標法)</div>
                <h3 style="font-size: 2.2rem; color: var(--accent); margin-bottom: 0;">${area.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} <span style="font-size: 1.2rem;">m²</span></h3>
            `;

            // --- SVG描画 (Xを縦軸、Yを横軸としてマッピング) ---
            const svgW = 800;
            const svgH = 800;
            const margin = 80; // ポップアップが見切れないように少し広めにとる
            
            const svg = createSVGElement('svg', {viewBox: `0 0 ${svgW} ${svgH}`, width: '100%'});

            let minX = Math.min(...pts.map(p => p.x));
            let maxX = Math.max(...pts.map(p => p.x));
            let minY = Math.min(...pts.map(p => p.y));
            let maxY = Math.max(...pts.map(p => p.y));
            
            let spanX = maxX - minX || 1;
            let spanY = maxY - minY || 1;
            
            // スケール計算（測量XがSVGのY、測量YがSVGのX）
            // ※測量座標のXは「北」が正なので、画面上ではYを反転させて上にいくほどXが大きくなるようにする
            let scale = Math.min((svgW - margin * 2) / spanY, (svgH - margin * 2) / spanX);
            
            // パス文字列の生成
            let pathD = pts.map((p, i) => {
                let cx = margin + (p.y - minY) * scale;
                let cy = svgH - margin - (p.x - minX) * scale; // Xを反転
                p.cx = cx; p.cy = cy; // 点の描画用に保存
                return `${i === 0 ? 'M' : 'L'}${cx},${cy}`;
            }).join(' ') + ' Z'; // 最後を閉じる
            
            // 塗りつぶしのパス
            const path = createSVGElement('path', {
                d: pathD, 
                fill: 'rgba(39, 174, 96, 0.15)', 
                stroke: 'var(--accent)', 
                'stroke-width': 2,
                'stroke-linejoin': 'round'
            });
            svg.appendChild(path);
            
            // 各頂点（変化点）とポップアップの描画
            pts.forEach(p => {
                const group = createSVGElement('g', {style: 'cursor: pointer;'});
                
                // 点
                const circle = createSVGElement('circle', {
                    cx: p.cx, cy: p.cy, r: 6, fill: '#e74c3c', stroke: '#fff', 'stroke-width': 2
                });
                
                // ポップアップグループ (初期は非表示)
                const popup = createSVGElement('g', {display: 'none'});
                
                // 文字列の長さに合わせて背景の幅を大まかに調整
                const textWidth = p.point.length * 9 + 16; 
                
                const bg = createSVGElement('rect', {
                    x: p.cx + 10, y: p.cy - 24, 
                    width: textWidth, height: 24, 
                    fill: 'rgba(0,0,0,0.8)', rx: 4
                });
                const text = createSVGElement('text', {
                    x: p.cx + 10 + (textWidth / 2), y: p.cy - 8, 
                    fill: '#fff', 'font-size': '13px', 'font-weight': 'bold',
                    'text-anchor': 'middle'
                });
                text.textContent = p.point;
                
                popup.appendChild(bg);
                popup.appendChild(text);
                
                group.appendChild(circle);
                group.appendChild(popup);
                
                // タップ/クリックで表示切替
                group.addEventListener('click', () => {
                    let isVisible = popup.getAttribute('display') !== 'none';
                    popup.setAttribute('display', isVisible ? 'none' : 'block');
                });
                
                svg.appendChild(group);
            });

            svgArea.appendChild(svg);
        }


        btn.addEventListener('click', async () => { 
            unlockAudio();

            const apiKey = apiKeyInput.value.trim(); 
            const files = imageInput.files; 
            
            if(!apiKey) { alert('APIキーを入力してください'); return; } 
            if(files.length === 0) { alert('GNSS野帳の画像を選択してください'); return; } 
            
            localStorage.setItem('gemini_api_key_gnss', apiKey); 
            btn.disabled = true; loading.style.display = 'block'; resultArea.style.display = 'none'; 
            
            try { 
                const modelName = await findAvailableModel(apiKey); 
                loadingDetail.innerText = `画像読取・復元中 (${modelName}を使用)...`;

                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: modelName });
                
                const prompt = `
                    あなたは測量データのデジタル化を行うアシスタントです。
                    添付された画像は、GNSS測量の野帳（座標一覧表）です。
                    画像1枚目から順番に表のデータ行を読み取り、以下のJSONフォーマットで出力してください。画像が複数枚ある場合は、すべての表を1つの配列に連続して結合してください。

                    【非常に重要】
                    1. 「測点名（または測点）」「X座標」「Y座標」の列を読み取ってください。
                    2. 画像の中の数値には、撮影のブレ等による誤認識の可能性がありますが、自動計算等で修正せず、見たままの数値をそのまま抽出してください。
                    3. X座標とY座標はカンマを除いた数値（Number）として出力してください。

                    {
                      "rows": [
                        {"point": "0", "x": 11659.089, "y": 46181.200},
                        {"point": "1", "x": 11680.276, "y": 46144.411}
                      ]
                    }

                    【厳守事項】
                    ・空欄のセルは null にしてください。
                    ・Markdownブロック(\`\`\`json)は不要です。純粋なJSONのみを返してください。
                `;

                const imageParts = await Promise.all([...files].map(fileToGenerativePart));
                const result = await model.generateContent([prompt, ...imageParts]);
                let text = await result.response.text();
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                
                currentData = JSON.parse(text);
                
                renderTable(currentData);
                resultArea.style.display = 'block';
                
                playSound('success');

            } catch (error) {
                console.error(error);
                playSound('error');
                alert('エラーが発生しました。\n・APIキーが正しいか\n・画像の画質が低すぎないか\nを確認してください。\n詳細: ' + error.message);
            } finally {
                btn.disabled = false; loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
